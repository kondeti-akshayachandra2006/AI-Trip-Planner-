name: QA Test Suites (reports only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa-test-reports:
    name: Generate QA reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install and start web application
        working-directory: PDD_app
        run: |
          npm install --legacy-peer-deps
          npm run build
          nohup npx vite preview --host 0.0.0.0 --port 5173 > /tmp/pdd-web.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pdd-web.log
          exit 1

      - name: Install Selenium test dependencies
        working-directory: PDD_app/frontend/selenium-tests
        run: npm install

      - name: Run Selenium login tests
        working-directory: PDD_app/frontend/selenium-tests
        run: npm run test:login

      - name: Generate Selenium report
        working-directory: PDD_app/frontend/selenium-tests
        run: npm run generate:report

      - name: Install Appium/load test dependencies
        working-directory: PDD_app/appium-test
        run: npm install

      - name: Run Appium dry-run suite
        working-directory: PDD_app/appium-test
        run: npm run appium:dry-run

      - name: Run load test suite
        working-directory: PDD_app/appium-test
        run: npm run load:test

      - name: Generate Appium and load test report
        working-directory: PDD_app/appium-test
        run: npm run report

      - name: Upload QA test suite report files
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-suite-reports
          path: |
            PDD_app/frontend/selenium-tests/tests/selenium-test-summary.json
            PDD_app/frontend/selenium-tests/tests/Selenium_E2E_Report_2026-08-04.xlsx
            PDD_app/frontend/selenium-tests/artifacts
            PDD_app/appium-test/results/appium-results.json
            PDD_app/appium-test/results/load-results.json
            PDD_app/appium-test/reports/appium-load-test-summary.xlsx
