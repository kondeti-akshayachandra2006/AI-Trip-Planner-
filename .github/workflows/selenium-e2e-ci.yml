name: Selenium E2E CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: ci: trigger selenium-ci workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install and start web application
        working-directory: PDD_app
        run: |
          npm install --legacy-peer-deps
          npm run build
          nohup npx vite preview --host 0.0.0.0 --port 5173 > /tmp/pdd-web.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pdd-web.log
          exit 1

      - name: Install Selenium dependencies
        working-directory: PDD_app/frontend/selenium-tests
        run: npm install

      - name: Run Selenium login tests
        working-directory: PDD_app/frontend/selenium-tests
        run: npm run test:login

      - name: Generate Selenium report
        working-directory: PDD_app/frontend/selenium-tests
        run: npm run generate:report

      - name: Upload Selenium report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-ci-artifacts
          path: |
            PDD_app/frontend/selenium-tests/tests/selenium-test-summary.json
            PDD_app/frontend/selenium-tests/tests/Selenium_E2E_Report_2026-08-04.xlsx
