name: Publish QA Report Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-reports:
    name: Publish QA report files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Selenium test dependencies
        working-directory: frontend/selenium-tests
        run: npm install

      - name: Install Appium/load test dependencies
        working-directory: appium-test
        run: npm install

      - name: Ensure report files exist
        run: |
          mkdir -p frontend/selenium-tests/tests
          mkdir -p appium-test/results
          mkdir -p appium-test/reports

      - name: Upload QA report artifact files
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-files
          path: |
            frontend/selenium-tests/tests/selenium-test-summary.json
            frontend/selenium-tests/tests/Selenium_E2E_Report_2026-08-04.xlsx
            appium-test/results/appium-results.json
            appium-test/results/load-results.json
            appium-test/reports/appium-load-test-summary.xlsx
