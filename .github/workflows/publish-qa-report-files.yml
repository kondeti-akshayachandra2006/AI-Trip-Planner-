name: Publish QA Report Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-reports:
    name: Publish QA report files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Selenium test dependencies
        working-directory: PDD_app/frontend/selenium-tests
        run: npm install

      - name: Install Appium/load test dependencies
        working-directory: PDD_app/appium-test
        run: npm install

      - name: Generate Selenium report
        working-directory: PDD_app/frontend/selenium-tests
        run: npm run generate:report

      - name: Generate Appium and load reports
        working-directory: PDD_app/appium-test
        env:
          LOAD_TARGET: http://example.com/
          LOAD_USERS: 100
          LOAD_DURATION_MS: 30000
        run: |
          npm run appium:dry-run
          node scripts/load-test.js
          node scripts/generate-report.js

      - name: Upload QA report artifact files
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-files
          path: |
            PDD_app/frontend/selenium-tests/tests/selenium-test-summary.json
            PDD_app/frontend/selenium-tests/tests/Selenium_E2E_Report_2026-08-04.xlsx
            PDD_app/appium-test/results/appium-results.json
            PDD_app/appium-test/results/load-results.json
            PDD_app/appium-test/reports/appium-load-test-summary.xlsx
